<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City-Move routine-data landscape</title>
<meta name="description" content="Routine data records for physical activity in six cities (Antwerp, Bogotá, Kampala, Lima, Ljubljana, Rotterdam), mapped to the City-Move indicator framework.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root {
  --navy: #213142;
  --text: #213142;
  --muted: #5b6878;
  --faint: #8a94a0;
  --line: #dde1e6;
  --line-2: #c3cad3;
  --soft: #f3f5f7;
  --lavender: #807ca8;
  --direct: #213142;
  --proxy: #9aabbf;
  --font: "Avenir Next", Avenir, "Nunito Sans", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 15px/1.5 var(--font);
  color: var(--text);
  background: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  font-variant-numeric: tabular-nums;
}
a { color: var(--navy); }
h2, h3 { color: var(--navy); margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

/* header, after citymove.info */
.site { flex: 0 0 auto; display: flex; align-items: center; gap: 22px; padding: 10px 24px; border-bottom: 1px solid var(--line); }
.site .logo img { height: 46px; display: block; }
.site-title h1 { font-size: 17px; line-height: 1.25; font-weight: 800; margin: 0; color: var(--navy); letter-spacing: -0.01em; }
.site-title p { font-size: 13px; color: var(--muted); margin-top: 1px; }
.site-nav { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.site-nav a { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.03em; text-decoration: none; color: var(--navy); padding: 7px 11px; }
.site-nav a:hover { background: var(--soft); }
.site-nav a[aria-current="page"] { background: var(--navy); color: #fff; }
.site .eu { height: 34px; display: block; margin-left: 8px; }

/* layout */
.layout { flex: 1 1 auto; display: flex; min-height: 0; }
#map { flex: 1 1 auto; min-width: 0; }
#panel { flex: 0 0 470px; border-left: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
.panel-body { padding: 0 26px 24px; flex: 1 0 auto; }

/* section band, after the "CityMove Cities" header on citymove.info */
.band {
  --c: var(--lavender);
  margin: 0 -26px 0; padding: 22px 26px 16px;
  background: linear-gradient(90deg, var(--c) 0%, rgba(255, 255, 255, 0) 78%);
}
.band h2 { font-size: 27px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
.band h2 .h-sub { font-size: 16px; font-weight: 400; letter-spacing: 0; }
.crumbs { font-size: 13px; margin: 14px 0 0; color: var(--muted); }
.crumbs a { text-decoration: none; border-bottom: 1px solid var(--line-2); }
.crumbs a:hover { border-bottom-color: var(--navy); }
.crumbs .sep { margin: 0 7px; color: var(--faint); }

.lede { margin: 14px 0 18px; }
.note, .hint { font-size: 13px; color: var(--muted); margin-top: 16px; }
.hint { margin: 10px 0 0; }
.panel-body h3 { font-size: 15px; font-weight: 800; margin: 26px 0 8px; }
.panel-body h3 .h-count { font-weight: 400; color: var(--muted); font-size: 14px; }
.facts-line { margin-top: 14px; color: var(--muted); font-size: 14px; }
.facts-line b { color: var(--navy); }

/* city tag with heartbeat, after the map tags on citymove.info */
.pulse { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--c, var(--lavender)); box-shadow: 0 0 0 1px var(--navy); vertical-align: -3px; margin-right: 8px; flex: 0 0 18px; }
.pulse svg { display: block; width: 18px; height: 18px; }

/* key figures */
.facts { display: grid; grid-template-columns: 1fr 1fr; margin: 16px 0 0; border-top: 1px solid var(--line); }
.facts div { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
.facts div:nth-child(odd) { padding-right: 14px; border-right: 1px solid var(--line); }
.facts div:nth-child(even) { padding-left: 14px; }
.facts dt { font-size: 13px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 23px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; }
.facts dd small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; letter-spacing: 0; }

/* legend + bar lists */
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin: 4px 0 6px; }
.sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.sw-direct { background: var(--direct); }
.sw-proxy { background: var(--proxy); }
.bars { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.bar-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 6px;
  padding: 9px 8px 10px; margin: 0 -8px; border-bottom: 1px solid var(--line);
  text-decoration: none; color: var(--text);
}
.bar-row:hover { background: var(--soft); }
.bar-row:hover .bar-name { text-decoration: underline; text-underline-offset: 3px; }
.bar-label { font-weight: 700; display: flex; align-items: center; min-width: 0; }
.bar-sub { font-weight: 400; color: var(--muted); margin-left: 6px; }
.bar-val { font-weight: 700; text-align: right; }
.bar-val.none { font-weight: 400; color: var(--faint); }
.bar-track { grid-column: 1 / -1; display: flex; height: 8px; }
.seg { height: 8px; min-width: 2px; }
.seg + .seg { margin-left: 2px; }
.seg:last-child { border-radius: 0 3px 3px 0; }
.seg-direct { background: var(--direct); }
.seg-proxy { background: var(--proxy); }

/* search */
.search { display: block; margin: 18px 0 0; }
.search input { width: 100%; font: inherit; font-size: 14px; color: var(--text); padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 4px; background: #fff; }
.search input:focus { outline: 2px solid var(--navy); outline-offset: 0; }
.res-head { font-size: 14px; color: var(--muted); margin: 14px 0 6px; }

/* indicator tables */
.ind-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ind-table th, .ind-table td { border-bottom: 1px solid var(--line); padding: 7px 0; text-align: left; vertical-align: top; }
.ind-table thead th { font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0 6px; border-bottom-color: var(--line-2); }
.ind-table .num { text-align: right; width: 72px; white-space: nowrap; }
.ind-table tbody .num { font-weight: 700; padding-top: 8px; }
.ind-table tbody th { font-weight: 400; }
.ind { font: inherit; color: var(--navy); background: none; border: 0; padding: 1px 0; margin: 0; text-align: left; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
button.ind::before { content: "+"; width: 10px; flex: 0 0 10px; color: var(--muted); font-weight: 700; }
button.ind[aria-expanded="true"]::before { content: "\2212"; }
button.ind:hover { text-decoration: underline; text-underline-offset: 3px; }
.ind-row.none .ind { color: var(--faint); padding-left: 18px; cursor: default; }
.ind-row.none .num { color: var(--line-2); font-weight: 400; }
.ind-row.ctx .ind { font-style: italic; }
.ind-row.open th, .ind-row.open td { border-bottom-color: transparent; }
.rec-cell { padding: 0 0 10px !important; }

/* records: the whole row opens the source in a new tab */
.recs { list-style: none; margin: 0; padding: 0; }
.rec { position: relative; padding: 10px 12px 11px; border: 1px solid var(--line); border-bottom: 0; }
.rec:last-child { border-bottom: 1px solid var(--line); }
.rec.has-link { cursor: pointer; }
.rec.has-link:hover { background: var(--soft); box-shadow: inset 3px 0 0 var(--navy); }
.rec:focus-within { outline: 2px solid var(--navy); outline-offset: -2px; }
.rec-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.rec-kind::before { content: ""; width: 8px; height: 8px; background: var(--direct); }
.rec-kind.k-proxy::before { background: var(--proxy); }
.rec-kind.k-context::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--proxy); }
.rec-title { display: block; font-weight: 700; color: var(--navy); text-decoration: none; margin-top: 2px; overflow-wrap: anywhere; }
.rec-title:focus-visible { outline: none; }
.rec.has-link .rec-title::after { content: ""; position: absolute; inset: 0; }
.rec.has-link:hover .rec-title { text-decoration: underline; text-underline-offset: 3px; }
.ext { font-weight: 400; color: var(--faint); margin-left: 5px; }
.rec.has-link:hover .ext { color: var(--navy); }
.rec-ctx { font-size: 13px; color: var(--muted); margin-top: 2px; }
.rec-desc { font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rec-desc.open { display: block; }
.rec-more { position: relative; z-index: 1; font: inherit; font-size: 13px; color: var(--navy); background: none; border: 0; padding: 0; margin-top: 2px; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: pointer; }
.rec-more:hover { text-decoration-color: var(--navy); }
.rec-meta { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.rec-meta span + span::before { content: "\00b7"; margin: 0 6px; color: var(--faint); }
.uid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
.more { display: block; width: 100%; margin-top: 8px; padding: 8px; font: inherit; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--navy); background: #fff; border: 1px solid var(--navy); cursor: pointer; }
.more:hover { background: var(--navy); color: #fff; }

/* footer, after citymove.info */
.panel-foot { background: var(--navy); color: #fff; font-size: 12.5px; padding: 16px 26px 18px; flex: 0 0 auto; }
.panel-foot p + p { margin-top: 6px; }
.panel-foot a { color: #fff; }

@media (max-width: 860px) {
  body { height: auto; display: block; }
  .site { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }
  .site .logo img { height: 36px; }
  .site-title h1 { font-size: 15px; }
  .site-nav { order: 3; width: 100%; margin-left: -8px; flex-wrap: wrap; }
  .site-nav a { font-size: 11.5px; padding: 6px 8px; }
  .site-nav a.wide-only { display: none; }
  .site .eu { height: 26px; margin-left: auto; }
  .layout { display: block; }
  #map { height: 46vh; }
  #panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .panel-body { padding: 0 16px 20px; }
  .band { margin: 0 -16px; padding: 18px 16px 14px; }
  .panel-foot { padding: 14px 16px 16px; }
}
</style>
</head>

<script>
/* map_data.js is generated from data/WP4_master_full.csv by tools/build_map.py */
const D = window.MAP_DATA;
const R = {uid: 0, title: 1, desc: 2, src: 3, url: 4, kind: 5, cluster: 6, ind: 7, spans: 8, sp: 9, tm: 10, y0: 11, y1: 12};
const KIND = ['Direct match', 'Direct match, several indicators', 'Linked proxy', 'Contextual proxy'];
const KIND_CLASS = ['k-direct', 'k-direct', 'k-proxy', 'k-context'];
/* each city's colour on citymove.info; always shown with the city's name */
const CITY_COLOR = {Antwerp: '#807ca8', Rotterdam: '#f79400', Ljubljana: '#00a8c6', Bogota: '#ead06b', Kampala: '#47ae62', Lima: '#f05e7f'};
const NAVY = '#213142';
const HOME_BOX = [-95, 45, -25, 60];   /* lon min, lon max, lat min, lat max around the six cities */
const CITY_BOX = [6, 3.5];             /* half-width and half-height of a city view, degrees */
const PAGE = 50;

const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString('en-US');
const pct = (a, b) => (b ? Math.round(100 * a / b) : 0) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));
const slug = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const isDirect = r => r[R.kind] <= 1;
const coversDirect = (r, ii) => (r[R.kind] === 0 && r[R.ind] === ii) || (r[R.kind] === 1 && r[R.spans].includes(ii));
const clustersOf = di => D.clusters.map((c, ci) => ({...c, ci})).filter(c => c.domain === di);
const indicatorsOf = ci => D.indicators.map((x, ii) => ({...x, ii})).filter(x => x.cluster === ci);
const cityKeys = Object.keys(D.cities);
const TOTAL = cityKeys.reduce((s, c) => s + D.cities[c].n, 0);
const PULSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5h4l2-5 3.5 10 2.5-7 1.5 2h3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const pulse = city => `<span class="pulse" style="--c:${CITY_COLOR[city] || '#807ca8'}">${PULSE}</span>`;

/* per-city indexes, built once */
const IDX = {};
for (const c of cityKeys) {
  const recs = D.records[c];
  const byDomain = D.domains.map(() => []), byCluster = D.clusters.map(() => []);
  const inds = new Set();
  recs.forEach((r, i) => {
    byCluster[r[R.cluster]].push(i);
    byDomain[D.clusters[r[R.cluster]].domain].push(i);
    if (r[R.kind] === 0) inds.add(r[R.ind]);
    else if (r[R.kind] === 1) r[R.spans].forEach(x => inds.add(x));
  });
  IDX[c] = {
    recs, byDomain, byCluster, inds,
    direct: recs.filter(isDirect).length,
    sources: new Set(recs.map(r => r[R.src])).size,
    hay: recs.map(r => (r[R.title] + ' ' + r[R.desc] + ' ' + D.sources[r[R.src]] + ' ' + r[R.uid]).toLowerCase()),
  };
}
const sortRecs = (city, idxs) => {
  const recs = IDX[city].recs;
  return idxs.slice().sort((a, b) => (recs[a][R.kind] - recs[b][R.kind]) || recs[a][R.title].localeCompare(recs[b][R.title]));
};

/* ── map: line drawing after the cities map on citymove.info ── */
/* Widen a lon/lat box to the map's own aspect ratio (Mercator), so the map fills its area. */
function fitBox(lonMin, lonMax, latMin, latMax) {
  const el = $('#map'), want = (el.clientWidth || 800) / (el.clientHeight || 500);
  const rad = Math.PI / 180, my = d => Math.log(Math.tan(Math.PI / 4 + d * rad / 2));
  const unmy = y => (2 * Math.atan(Math.exp(y)) - Math.PI / 2) / rad;
  const xs = (lonMax - lonMin) * rad, y0 = my(latMin), y1 = my(latMax), ys = y1 - y0;
  if (xs / ys < want) {
    const pad = (ys * want - xs) / 2 / rad;
    return {lon: [lonMin - pad, lonMax + pad], lat: [latMin, latMax]};
  }
  const pad = (xs / want - ys) / 2;
  return {lon: [lonMin, lonMax], lat: [Math.max(-80, unmy(y0 - pad)), Math.min(82, unmy(y1 + pad))]};
}
const HOME = fitBox(...HOME_BOX);
const markerSize = n => Math.max(11, 0.45 * Math.sqrt(n));
const TEXTPOS = {Antwerp: 'bottom left', Rotterdam: 'top right', Bogota: 'middle right', Lima: 'middle left', Ljubljana: 'middle right', Kampala: 'middle right'};
const fontFamily = getComputedStyle(document.body).fontFamily;
Plotly.newPlot('map', [{
  type: 'scattergeo', mode: 'markers+text',
  lon: cityKeys.map(c => D.cities[c].lon), lat: cityKeys.map(c => D.cities[c].lat),
  text: cityKeys.map(c => D.cities[c].label), customdata: cityKeys,
  textposition: cityKeys.map(c => TEXTPOS[c] || 'top center'),
  textfont: {family: fontFamily, size: 13, color: NAVY, weight: 700},
  hovertemplate: cityKeys.map(c => `<b>${D.cities[c].label}</b>, ${D.cities[c].country}<br>${fmt(D.cities[c].n)} records<extra></extra>`),
  hoverlabel: {bgcolor: '#ffffff', bordercolor: NAVY, font: {family: fontFamily, color: NAVY, size: 13}},
  marker: {
    size: cityKeys.map(c => markerSize(D.cities[c].n)),
    color: cityKeys.map(c => CITY_COLOR[c]), opacity: 1,
    line: {color: NAVY, width: cityKeys.map(() => 1.2)},
  },
}], {
  margin: {l: 0, r: 0, t: 0, b: 0}, paper_bgcolor: '#ffffff', dragmode: false,
  font: {family: fontFamily, color: NAVY},
  geo: {
    projection: {type: 'mercator'},
    resolution: 50, showframe: false,
    showland: true, landcolor: '#ffffff', showocean: false, showlakes: false,
    showcoastlines: true, coastlinecolor: NAVY, coastlinewidth: 0.9,
    showcountries: true, countrycolor: NAVY, countrywidth: 0.45,
    bgcolor: '#ffffff', lataxis: {showgrid: false, range: HOME.lat}, lonaxis: {showgrid: false, range: HOME.lon},
  },
}, {responsive: true, displayModeBar: false, scrollZoom: false});
let fromMap = false;
$('#map').on('plotly_click', e => {
  const c = e.points && e.points[0] && e.points[0].customdata;
  if (c) { fromMap = true; location.hash = '#/' + slug(c); }
});
function mapSelect(city) {
  const on = cityKeys.map(c => c === city);
  Plotly.restyle('map', {
    'marker.line.width': [on.map(s => (s ? 3 : 1.2))],
    'marker.size': [cityKeys.map((c, i) => markerSize(D.cities[c].n) + (on[i] ? 6 : 0))],
  });
  const c = city && D.cities[city];
  const v = c ? fitBox(c.lon - CITY_BOX[0], c.lon + CITY_BOX[0], c.lat - CITY_BOX[1], c.lat + CITY_BOX[1]) : fitBox(...HOME_BOX);
  Plotly.relayout('map', {'geo.lonaxis.range': v.lon, 'geo.lataxis.range': v.lat});
}
window.addEventListener('resize', debounce(() => { Plotly.Plots.resize('map'); mapSelect(state.city); }, 150));

/* ── building blocks ── */
const legend = () => '<p class="legend"><span><span class="sw sw-direct"></span>Direct match</span><span><span class="sw sw-proxy"></span>Proxy</span></p>';
const fact = (label, value, sub) => `<div><dt>${label}</dt><dd>${value}${sub ? `<small>${sub}</small>` : ''}</dd></div>`;
const crumbs = parts => `<nav class="crumbs" aria-label="Breadcrumb">${parts.map((p, i) => (i < parts.length - 1
  ? `<a href="${p.href}">${esc(p.label)}</a><span class="sep">/</span>`
  : `<span aria-current="page">${esc(p.label)}</span>`)).join('')}</nav>`;
const band = (color, inner) => `<div class="band" style="--c:${color}">${inner}</div>`;

function barList(rows, max) {
  return `<ol class="bars">${rows.map(r => {
    const total = r.direct + r.proxy;
    const w = v => (max ? (100 * v / max).toFixed(2) : 0);
    const tip = total ? `${fmt(r.direct)} direct, ${fmt(r.proxy)} proxy` : 'no records';
    return `<li><a class="bar-row" href="${r.href}" title="${tip}">
      <span class="bar-label">${r.city ? pulse(r.city) : ''}<span class="bar-name">${esc(r.label)}</span>${r.sub ? `<span class="bar-sub">${esc(r.sub)}</span>` : ''}</span>
      <span class="bar-val${total ? '' : ' none'}">${total ? fmt(total) : 'none'}<span class="visually-hidden"> records: ${tip}</span></span>
      <span class="bar-track" aria-hidden="true">${r.direct ? `<span class="seg seg-direct" style="width:${w(r.direct)}%"></span>` : ''}${r.proxy ? `<span class="seg seg-proxy" style="width:${w(r.proxy)}%"></span>` : ''}</span>
    </a></li>`;
  }).join('')}</ol>`;
}

function recItem(city, i, withContext) {
  const r = IDX[city].recs[i], k = r[R.kind], cl = D.clusters[r[R.cluster]];
  const ctx = [];
  if (withContext) ctx.push(esc(D.domains[cl.domain].name) + ' › ' + esc(cl.name) + (r[R.ind] >= 0 ? ' › ' + esc(D.indicators[r[R.ind]].name) : ''));
  if (k === 1) ctx.push('Covers: ' + r[R.spans].map(s => esc(D.indicators[s].name)).join('; '));
  const yrs = r[R.y0] == null ? '' : (r[R.y0] === r[R.y1] ? String(r[R.y0]) : `${r[R.y0]}–${r[R.y1]}`);
  const title = r[R.url]
    ? `<a class="rec-title" href="${esc(r[R.url])}" target="_blank" rel="noopener noreferrer">${esc(r[R.title])}<span class="ext" aria-hidden="true">↗</span><span class="visually-hidden"> (opens the source in a new tab)</span></a>`
    : `<span class="rec-title">${esc(r[R.title])}</span>`;
  return `<li class="rec${r[R.url] ? ' has-link' : ''}">
    <p class="rec-kind ${KIND_CLASS[k]}">${KIND[k]}</p>
    ${title}
    ${ctx.length ? `<p class="rec-ctx">${ctx.join(' · ')}</p>` : ''}
    <p class="rec-desc">${esc(r[R.desc])}</p>
    ${r[R.desc].length > 160 ? '<button type="button" class="rec-more">Show full description</button>' : ''}
    <p class="rec-meta"><span>${esc(D.sources[r[R.src]])}</span><span>${esc(D.spatial[r[R.sp]])}</span><span>${esc(D.temporal[r[R.tm]])}${yrs ? ', ' + yrs : ''}</span><span class="uid">${esc(r[R.uid])}</span></p>
  </li>`;
}

function renderRecords(el, city, idxs, withContext) {
  if (!idxs.length) { el.innerHTML = '<p class="hint">No records.</p>'; return; }
  const list = document.createElement('ul'), more = document.createElement('button');
  list.className = 'recs';
  more.type = 'button';
  more.className = 'more';
  let shown = 0;
  const page = () => {
    const slice = idxs.slice(shown, shown + PAGE);
    list.insertAdjacentHTML('beforeend', slice.map(i => recItem(city, i, withContext)).join(''));
    shown += slice.length;
    const left = idxs.length - shown;
    more.hidden = left <= 0;
    more.textContent = `Show ${fmt(Math.min(PAGE, left))} more (${fmt(left)} not shown)`;
  };
  more.addEventListener('click', page);
  el.replaceChildren(list, more);
  page();
}

/* ── views ── */
const body = $('#panelBody');
$('#footSource').innerHTML = `Source: City-Move WP4 master inventory, generated ${esc(D.meta.generated)}.
  ${fmt(D.meta.excluded)} records excluded after review are kept in the <a href="data/WP4_master_full.csv" download>data file</a> but not shown.
  Descriptions are English translations of the catalogue text.`;

function showHome() {
  const rows = cityKeys.slice().sort((a, b) => D.cities[b].n - D.cities[a].n).map(c => ({
    city: c, label: D.cities[c].label, sub: D.cities[c].country, href: '#/' + slug(c),
    direct: IDX[c].direct, proxy: D.cities[c].n - IDX[c].direct,
  }));
  body.innerHTML = `
    ${band('#807ca8', '<h2>Six cities</h2>')}
    <p class="lede">${fmt(TOTAL)} routine data records found in the six cities' data catalogues and through structured
      searches, each matched to the City-Move framework of ${D.indicators.length} indicators for physical activity and
      its determinants. Choose a city on the map or in the list.</p>
    ${legend()}
    ${barList(rows, Math.max(...rows.map(r => r.direct + r.proxy)))}
    <p class="note">A direct match measures a framework indicator as defined; a proxy bears on an indicator or cluster
      without measuring it. A record is one entry as its source lists it (a dataset, table, map layer or survey
      variable), so the counts reflect publishing conventions as much as the amount of data.</p>`;
  mapSelect(null);
}

function showCity(city) {
  const c = D.cities[city], X = IDX[city];
  const rows = D.domains.map((d, di) => {
    const idxs = X.byDomain[di], direct = idxs.filter(i => isDirect(X.recs[i])).length;
    return {label: d.name, href: `#/${slug(city)}/${slug(d.name)}`, direct, proxy: idxs.length - direct};
  });
  body.innerHTML = `
    ${band(CITY_COLOR[city], `<h2>${esc(c.label)} <span class="h-sub">${esc(c.country)}</span></h2>`)}
    ${crumbs([{label: 'Six cities', href: '#/'}, {label: c.label}])}
    <dl class="facts">
      ${fact('Records', fmt(c.n))}
      ${fact('Direct matches', fmt(X.direct), pct(X.direct, c.n))}
      ${fact('Indicators with direct data', X.inds.size, `of ${D.indicators.length}`)}
      ${fact('Sources', X.sources, 'platforms and publishers')}
    </dl>
    <label class="search"><span class="visually-hidden">Search ${esc(c.label)}'s records</span>
      <input type="search" id="q" autocomplete="off" placeholder="Search ${esc(c.label)}'s records by title, description, source or id"></label>
    <div id="results" hidden></div>
    <section id="domains">
      <h3>Records by domain</h3>
      ${legend()}
      ${barList(rows, Math.max(1, ...rows.map(r => r.direct + r.proxy)))}
    </section>`;
  $('#q').addEventListener('input', debounce(e => search(city, e.target.value), 180));
  mapSelect(city);
}

function search(city, raw) {
  const q = raw.trim().toLowerCase(), res = $('#results'), doms = $('#domains');
  if (q.length < 2) { res.hidden = true; doms.hidden = false; return; }
  const hits = [];
  IDX[city].hay.forEach((h, i) => { if (h.includes(q)) hits.push(i); });
  res.innerHTML = `<p class="res-head">${fmt(hits.length)} record${hits.length === 1 ? '' : 's'} match “${esc(raw.trim())}”</p><div></div>`;
  renderRecords(res.lastElementChild, city, sortRecs(city, hits), true);
  res.hidden = false;
  doms.hidden = true;
}

function clusterTable(city, cl) {
  const X = IDX[city], inC = X.byCluster[cl.ci];
  const rows = indicatorsOf(cl.ci).map(x => ({
    key: 'i' + x.ii, name: x.name, tip: x.op,
    dN: inC.filter(i => coversDirect(X.recs[i], x.ii)).length,
    pN: inC.filter(i => X.recs[i][R.kind] === 2 && X.recs[i][R.ind] === x.ii).length,
  }));
  const ctx = inC.filter(i => X.recs[i][R.kind] === 3).length;
  if (ctx) rows.push({key: 'c' + cl.ci, name: 'Contextual records (whole cluster)', tip: 'Proxies relevant to the cluster as a whole, without a link to one indicator', dN: 0, pN: ctx, ctx: true});
  const cell = n => (n ? fmt(n) : '–');
  return `<section class="cluster">
    <h3>${esc(cl.name)} <span class="h-count">${fmt(inC.length)} record${inC.length === 1 ? '' : 's'}</span></h3>
    <table class="ind-table">
      <thead><tr><th scope="col">Indicator</th><th scope="col" class="num"><span class="sw sw-direct"></span>Direct</th><th scope="col" class="num"><span class="sw sw-proxy"></span>Proxy</th></tr></thead>
      <tbody>${rows.map(r => (r.dN + r.pN
        ? `<tr class="ind-row${r.ctx ? ' ctx' : ''}"><th scope="row" title="${esc(r.tip)}"><button type="button" class="ind" data-key="${r.key}" aria-expanded="false">${esc(r.name)}</button></th><td class="num">${cell(r.dN)}</td><td class="num">${cell(r.pN)}</td></tr>`
        : `<tr class="ind-row none"><th scope="row" title="${esc(r.tip)}"><span class="ind">${esc(r.name)}</span></th><td class="num">–</td><td class="num">–</td></tr>`)).join('')}
      </tbody>
    </table>
  </section>`;
}

function showDomain(city, di) {
  const c = D.cities[city], X = IDX[city], d = D.domains[di];
  const idxs = X.byDomain[di], direct = idxs.filter(i => isDirect(X.recs[i])).length;
  const cls = clustersOf(di), inds = cls.flatMap(cl => indicatorsOf(cl.ci));
  const covered = inds.filter(x => X.inds.has(x.ii)).length;
  body.innerHTML = `
    ${band(CITY_COLOR[city], `<h2>${esc(d.name)}</h2>`)}
    ${crumbs([{label: 'Six cities', href: '#/'}, {label: c.label, href: '#/' + slug(city)}, {label: d.name}])}
    <p class="facts-line"><b>${fmt(idxs.length)}</b> records in ${esc(c.label)}: <b>${fmt(direct)}</b> direct, <b>${fmt(idxs.length - direct)}</b> proxy.
      <b>${covered}</b> of ${inds.length} indicators have direct data.</p>
    <p class="hint">Open an indicator to list its records; each record opens its source in a new tab. Greyed indicators have no record in ${esc(c.label)}.</p>
    ${cls.map(cl => clusterTable(city, cl)).join('')}`;
  mapSelect(city);
}

function recordsFor(city, key) {
  const {recs, byCluster} = IDX[city];
  if (key[0] === 'i') {
    const ii = +key.slice(1);
    return byCluster[D.indicators[ii].cluster].filter(i => coversDirect(recs[i], ii) || (recs[i][R.kind] === 2 && recs[i][R.ind] === ii));
  }
  return byCluster[+key.slice(1)].filter(i => recs[i][R.kind] === 3);
}

body.addEventListener('click', e => {
  const more = e.target.closest('.rec-more');
  if (more) {
    const desc = more.previousElementSibling, open = desc.classList.toggle('open');
    more.textContent = open ? 'Show less' : 'Show full description';
    return;
  }
  const btn = e.target.closest('button.ind');
  if (!btn) return;
  const tr = btn.closest('tr'), next = tr.nextElementSibling;
  if (next && next.classList.contains('rec-tr')) {
    next.remove();
    tr.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    return;
  }
  const row = document.createElement('tr');
  row.className = 'rec-tr';
  row.innerHTML = '<td class="rec-cell" colspan="3"></td>';
  tr.after(row);
  tr.classList.add('open');
  btn.setAttribute('aria-expanded', 'true');
  renderRecords(row.firstElementChild, state.city, sortRecs(state.city, recordsFor(state.city, btn.dataset.key)), false);
});

/* ── routing: #/city and #/city/domain ── */
let state = {city: null, di: null};
function route() {
  const [cPart, dPart] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  const city = cityKeys.find(c => slug(c) === (cPart || '').toLowerCase()) || null;
  const di = city && dPart ? D.domains.findIndex(d => slug(d.name) === dPart) : -1;
  state = {city, di: di >= 0 ? di : null};
  if (!city) showHome();
  else if (state.di === null) showCity(city);
  else showDomain(city, state.di);
  $('#panel').scrollTop = 0;
  if (fromMap && window.matchMedia('(max-width: 860px)').matches) $('#panel').scrollIntoView({behavior: 'smooth', block: 'start'});
  fromMap = false;
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
